<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'">

  <link rel="stylesheet" href="masar.css">

<body class="theme-hr">

      <div id="banner"></div>
      <main id="desktop" class="flex-1 overflow-y-auto bg-[var(--apex-canvas)]"></main>
    </div>
  </div>
  <div id="print-area"></div>

  <script src="windows/reports.js"></script>
